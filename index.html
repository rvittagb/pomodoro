<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foco — Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- KaTeX para renderizar matemática bonita -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #1a1814;
    --bg-elevated: #221f1a;
    --bg-hover: #2a2620;
    --border: #2e2a23;
    --text: #e8e3d8;
    --text-dim: #8a8378;
    --text-faint: #5a544a;
    --accent: #d4a574;
    --accent-soft: #d4a57420;
    --danger: #c9614a;
    --success: #7a9a6a;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    overflow: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 20%, #2a241c 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #1f1d1a 0%, transparent 50%);
  }

  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
  }

  .sidebar {
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    padding: 32px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .brand {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 300;
    font-style: italic;
    letter-spacing: -0.02em;
  }
  .brand span { color: var(--accent); }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-faint);
    margin-bottom: 12px;
    font-weight: 500;
  }

  .time-config {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .time-input-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .time-input-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .time-input-group input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .time-input-group input:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .sound-config {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sound-current {
    font-size: 13px;
    color: var(--text-dim);
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }
  .sound-current-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sound-current-name strong { color: var(--text); font-weight: 500; }
  .sound-remove {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .sound-remove:hover { color: var(--danger); }

  .sound-actions {
    display: flex;
    gap: 8px;
  }
  .sound-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .sound-btn:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .sound-btn.testing {
    border-color: var(--accent);
    color: var(--accent);
  }
  #soundFileInput { display: none; }

  .task-add {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .task-add input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  .task-add input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .task-add button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 18px;
    transition: opacity 0.2s;
  }
  .task-add button:hover { opacity: 0.85; }

  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .task-item:hover { background: var(--bg-hover); }
  .task-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--text-faint);
  }
  .task-checkbox {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-faint);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .task-item.done .task-checkbox {
    background: var(--success);
    border-color: var(--success);
  }
  .task-item.done .task-checkbox::after {
    content: '✓';
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
  }
  .task-text {
    flex: 1;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-delete {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    font-size: 16px;
    padding: 0 4px;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--danger); }

  .empty-tasks {
    color: var(--text-faint);
    font-size: 13px;
    font-style: italic;
    text-align: center;
    padding: 24px 0;
  }

  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
  }

  .session-status {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .current-task {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 60px;
    min-height: 20px;
    text-align: center;
    max-width: 500px;
  }

  .timer-display {
    font-family: var(--serif);
    font-size: 220px;
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    margin-bottom: 60px;
    user-select: none;
  }
  .timer-display.running { color: var(--text); }
  .timer-display.break { color: var(--success); }

  .timer-controls {
    display: flex;
    gap: 16px;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.2s;
    font-family: var(--sans);
  }
  .btn:hover {
    background: var(--bg-hover);
    border-color: var(--text-faint);
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover {
    background: var(--accent);
    opacity: 0.9;
    border-color: var(--accent);
  }
  .btn-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--text);
  }
  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .session-counter {
    position: absolute;
    bottom: 32px;
    right: 32px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }
  .session-counter span { color: var(--accent); }

  .silence-btn {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: none;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .silence-btn.show { display: block; }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s ease-out;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    max-width: 580px;
    width: 90%;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.3s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .modal-subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
  }

  /* Questão e respostas com KaTeX renderizado */
  .question {
    background: var(--bg);
    padding: 28px 24px;
    border-radius: 8px;
    margin-bottom: 24px;
    text-align: center;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 26px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question .katex { font-size: 1.4em; }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .option {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 18px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
    text-align: center;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option .katex { font-size: 1.1em; }
  .option:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .option.wrong {
    border-color: var(--danger);
    background: rgba(201, 97, 74, 0.1);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .modal-feedback {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    min-height: 20px;
    margin-bottom: 16px;
  }
  .modal-feedback.error { color: var(--danger); }

  .modal-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
  }
  .modal-cancel:hover {
    color: var(--text);
    border-color: var(--text-faint);
  }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
    .timer-display { font-size: 120px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">foco<span>.</span></div>

    <div>
      <div class="section-label">Tempo</div>
      <div class="time-config">
        <div class="time-input-group">
          <label>Foco (min)</label>
          <input type="number" id="focusMinutes" min="1" max="120" value="25">
        </div>
        <div class="time-input-group">
          <label>Descanso (min)</label>
          <input type="number" id="breakMinutes" min="1" max="60" value="5">
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Despertador</div>
      <div class="sound-config">
        <div class="sound-current">
          <div class="sound-current-name" id="soundCurrentName">
            <strong>Padrão</strong> — sino suave
          </div>
          <button class="sound-remove" id="soundRemoveBtn" style="display:none;" title="Voltar pro padrão">×</button>
        </div>
        <div class="sound-actions">
          <button class="sound-btn" id="soundTestBtn">▶ Testar</button>
          <button class="sound-btn" id="soundUploadBtn">↑ Carregar MP3</button>
          <input type="file" id="soundFileInput" accept="audio/*">
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Tarefas</div>
      <div class="task-add">
        <input type="text" id="taskInput" placeholder="Nova tarefa..." maxlength="80">
        <button id="addTaskBtn">+</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
      <div class="empty-tasks" id="emptyTasks">Nenhuma tarefa ainda</div>
    </div>
  </aside>

  <main class="main">
    <div class="session-status" id="sessionStatus">Pronto pra focar</div>
    <div class="current-task" id="currentTask"></div>
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="timer-controls">
      <button class="btn btn-primary" id="startBtn">Iniciar</button>
      <button class="btn" id="pauseBtn" disabled>Pausar</button>
      <button class="btn btn-danger" id="stopBtn" disabled>Parar</button>
    </div>
    <div class="session-counter">Sessões concluídas: <span id="sessionCount">0</span></div>
  </main>
</div>

<button class="silence-btn" id="silenceBtn">Silenciar</button>

<div class="modal-overlay" id="mathModal">
  <div class="modal">
    <div class="modal-title">Quer mesmo parar?</div>
    <div class="modal-subtitle">Resolva pra liberar. Errou? Vem outra.</div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="modal-feedback" id="feedback"></div>
    <button class="modal-cancel" id="modalCancel">Voltar pro foco</button>
  </div>
</div>

<script>
const state = {
  focusMin: 25,
  breakMin: 5,
  remainingSec: 25 * 60,
  isRunning: false,
  isPaused: false,
  isBreak: false,
  intervalId: null,
  tasks: [],
  activeTaskId: null,
  sessionsCompleted: 0,
  currentQuestion: null,
  customSound: null,

  // Estado de áudio unificado — sempre só uma coisa toca por vez
  currentAudioCtx: null,    // Web Audio (som default)
  currentAudioElement: null, // <audio> (som customizado)
  currentTimers: [],         // timeouts a limpar
  isAlarmMode: false,        // true = alarme real, false = teste
};

const el = {
  focusMin: document.getElementById('focusMinutes'),
  breakMin: document.getElementById('breakMinutes'),
  display: document.getElementById('timerDisplay'),
  status: document.getElementById('sessionStatus'),
  currentTask: document.getElementById('currentTask'),
  startBtn: document.getElementById('startBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  stopBtn: document.getElementById('stopBtn'),
  taskInput: document.getElementById('taskInput'),
  addTaskBtn: document.getElementById('addTaskBtn'),
  taskList: document.getElementById('taskList'),
  emptyTasks: document.getElementById('emptyTasks'),
  sessionCount: document.getElementById('sessionCount'),
  modal: document.getElementById('mathModal'),
  question: document.getElementById('question'),
  options: document.getElementById('options'),
  feedback: document.getElementById('feedback'),
  modalCancel: document.getElementById('modalCancel'),
  soundCurrentName: document.getElementById('soundCurrentName'),
  soundRemoveBtn: document.getElementById('soundRemoveBtn'),
  soundTestBtn: document.getElementById('soundTestBtn'),
  soundUploadBtn: document.getElementById('soundUploadBtn'),
  soundFileInput: document.getElementById('soundFileInput'),
  silenceBtn: document.getElementById('silenceBtn'),
};

// =========== TIMER ===========
function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  el.display.textContent = formatTime(state.remainingSec);
  document.title = `${formatTime(state.remainingSec)} — ${state.isBreak ? 'Descanso' : 'Foco'}`;
}

function updateStatus() {
  if (!state.isRunning && !state.isPaused) {
    el.status.textContent = 'Pronto pra focar';
    el.display.className = 'timer-display';
  } else if (state.isBreak) {
    el.status.textContent = state.isPaused ? 'Descanso pausado' : 'Descansando';
    el.display.className = 'timer-display break';
  } else {
    el.status.textContent = state.isPaused ? 'Foco pausado' : 'Em foco';
    el.display.className = 'timer-display running';
  }
}

function updateCurrentTask() {
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  el.currentTask.textContent = task ? `→ ${task.text}` : '';
}

function startTimer() {
  if (!state.isPaused) {
    state.focusMin = parseInt(el.focusMin.value) || 25;
    state.breakMin = parseInt(el.breakMin.value) || 5;
    state.remainingSec = state.isBreak ? state.breakMin * 60 : state.focusMin * 60;
  }
  state.isRunning = true;
  state.isPaused = false;
  el.focusMin.disabled = true;
  el.breakMin.disabled = true;
  el.startBtn.disabled = true;
  el.pauseBtn.disabled = false;
  el.stopBtn.disabled = false;

  state.intervalId = setInterval(() => {
    state.remainingSec--;
    updateDisplay();
    if (state.remainingSec <= 0) {
      sessionEnded();
    }
  }, 1000);

  updateDisplay();
  updateStatus();
}

function pauseTimer() {
  clearInterval(state.intervalId);
  state.isRunning = false;
  state.isPaused = true;
  el.startBtn.disabled = false;
  el.startBtn.textContent = 'Continuar';
  el.pauseBtn.disabled = true;
  updateStatus();
}

function stopTimer() {
  showMathChallenge();
}

function forceStop() {
  clearInterval(state.intervalId);
  state.isRunning = false;
  state.isPaused = false;
  state.isBreak = false;
  state.remainingSec = (parseInt(el.focusMin.value) || 25) * 60;
  el.focusMin.disabled = false;
  el.breakMin.disabled = false;
  el.startBtn.disabled = false;
  el.startBtn.textContent = 'Iniciar';
  el.pauseBtn.disabled = true;
  el.stopBtn.disabled = true;
  updateDisplay();
  updateStatus();
}

function sessionEnded() {
  clearInterval(state.intervalId);
  playAlarm();

  if (state.isBreak) {
    state.isBreak = false;
    state.remainingSec = state.focusMin * 60;
    state.isRunning = false;
    state.isPaused = false;
    el.startBtn.disabled = false;
    el.startBtn.textContent = 'Iniciar';
    el.pauseBtn.disabled = true;
    el.stopBtn.disabled = true;
    el.focusMin.disabled = false;
    el.breakMin.disabled = false;
  } else {
    state.sessionsCompleted++;
    el.sessionCount.textContent = state.sessionsCompleted;
    state.isBreak = true;
    state.remainingSec = state.breakMin * 60;
    startTimer();
  }
  updateDisplay();
  updateStatus();
}

// =========== ÁUDIO (UNIFICADO) ===========
/**
 * Para QUALQUER som que esteja tocando.
 * Chamado antes de tocar qualquer som novo, e pelo botão Silenciar.
 */
function stopAllAudio() {
  // Para áudio HTML
  if (state.currentAudioElement) {
    state.currentAudioElement.pause();
    state.currentAudioElement.loop = false;
    state.currentAudioElement.currentTime = 0;
    state.currentAudioElement.onended = null;
    state.currentAudioElement = null;
  }
  // Fecha Web Audio context
  if (state.currentAudioCtx) {
    try { state.currentAudioCtx.close(); } catch(e) {}
    state.currentAudioCtx = null;
  }
  // Limpa timers
  state.currentTimers.forEach(t => clearTimeout(t));
  state.currentTimers = [];
  // Reset UI
  el.soundTestBtn.classList.remove('testing');
  el.soundTestBtn.textContent = '▶ Testar';
  state.isAlarmMode = false;
  el.silenceBtn.classList.remove('show');
}

/**
 * Toca o som default (acorde Em arpejado, fade suave).
 * isAlarm=true → loop INFINITO até clicar em Silenciar.
 * isAlarm=false → 1 repetição (teste).
 */
function playDefaultSound(isAlarm) {
  stopAllAudio();
  state.isAlarmMode = isAlarm;
  if (isAlarm) el.silenceBtn.classList.add('show');

  try {
    state.currentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = state.currentAudioCtx;
    const notes = [329.63, 392.00, 493.88]; // E4, G4, B4
    const intervalSec = 1.8;
    const noteDuration = 1.4;

    function playChord(startTime) {
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const t0 = startTime + i * 0.08;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + noteDuration);
        osc.start(t0);
        osc.stop(t0 + noteDuration);
      });
    }

    if (isAlarm) {
      // Alarme: agenda 8 acordes pra frente, e a cada 2 acordes
      // reagenda mais 8 — efeito loop infinito até stopAllAudio.
      // (O ctx.close() em stopAllAudio cancela tudo automaticamente.)
      let scheduled = 0;
      function scheduleBatch() {
        if (!state.currentAudioCtx) return; // foi silenciado
        const now = state.currentAudioCtx.currentTime;
        const batchSize = 8;
        for (let r = 0; r < batchSize; r++) {
          playChord(now + r * intervalSec);
        }
        scheduled++;
        // Reagenda quando faltarem ~2 acordes pra acabar a fila
        const reagendarEm = (batchSize - 2) * intervalSec * 1000;
        const t = setTimeout(scheduleBatch, reagendarEm);
        state.currentTimers.push(t);
      }
      scheduleBatch();
    } else {
      // Teste: 1 acorde só
      const now = ctx.currentTime;
      playChord(now);
      el.soundTestBtn.classList.add('testing');
      el.soundTestBtn.textContent = '⏸ Parar';
      const totalMs = (intervalSec + noteDuration) * 1000;
      const t = setTimeout(() => stopAllAudio(), totalMs);
      state.currentTimers.push(t);
    }
  } catch (e) {
    console.error('Erro no áudio:', e);
    stopAllAudio();
  }
}

/**
 * Toca o som customizado.
 * isAlarm=true → loop INFINITO até clicar em Silenciar.
 * isAlarm=false → toca por NO MÁXIMO 5s, sem loop (apenas pra ouvir uma amostra).
 */
function playCustomSound(isAlarm) {
  stopAllAudio();
  state.isAlarmMode = isAlarm;
  if (isAlarm) el.silenceBtn.classList.add('show');

  try {
    const audio = state.customSound.audioElement;
    audio.currentTime = 0;
    audio.loop = isAlarm;
    audio.play();
    state.currentAudioElement = audio;

    if (isAlarm) {
      // Alarme: loop infinito até clicar em Silenciar. Nada de timeout.
    } else {
      // Teste: para depois de 5s no máximo
      el.soundTestBtn.classList.add('testing');
      el.soundTestBtn.textContent = '⏸ Parar';
      const t = setTimeout(() => stopAllAudio(), 5000);
      state.currentTimers.push(t);
      // Se o áudio acabar antes dos 5s, libera o botão
      audio.onended = () => stopAllAudio();
    }
  } catch (e) {
    console.error('Erro no áudio customizado:', e);
    stopAllAudio();
  }
}

function playAlarm() {
  if (state.customSound) {
    playCustomSound(true);
  } else {
    playDefaultSound(true);
  }
}

function testSound() {
  // Se já tá tocando, o clique para
  if (state.currentAudioCtx || state.currentAudioElement) {
    stopAllAudio();
    return;
  }
  if (state.customSound) {
    playCustomSound(false);
  } else {
    playDefaultSound(false);
  }
}

function handleSoundUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('audio/')) {
    alert('Por favor selecione um arquivo de áudio (MP3, WAV, OGG, etc).');
    return;
  }

  // Para qualquer som que esteja tocando antes de trocar
  stopAllAudio();

  if (state.customSound) {
    URL.revokeObjectURL(state.customSound.audioElement.src);
  }

  const url = URL.createObjectURL(file);
  const audio = new Audio(url);
  audio.preload = 'auto';

  state.customSound = {
    name: file.name,
    audioElement: audio,
  };

  el.soundCurrentName.innerHTML = `<strong>${escapeHtml(file.name)}</strong>`;
  el.soundRemoveBtn.style.display = 'block';
  el.soundFileInput.value = '';
}

function removeCustomSound() {
  // Para qualquer som tocando antes de trocar
  stopAllAudio();

  if (state.customSound) {
    URL.revokeObjectURL(state.customSound.audioElement.src);
    state.customSound = null;
  }
  el.soundCurrentName.innerHTML = '<strong>Padrão</strong> — sino suave';
  el.soundRemoveBtn.style.display = 'none';
}

// =========== TAREFAS ===========
function renderTasks() {
  el.taskList.innerHTML = '';
  if (state.tasks.length === 0) {
    el.emptyTasks.style.display = 'block';
    return;
  }
  el.emptyTasks.style.display = 'none';
  state.tasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item';
    if (task.id === state.activeTaskId) li.classList.add('active');
    if (task.done) li.classList.add('done');
    li.innerHTML = `
      <div class="task-checkbox" data-action="toggle"></div>
      <div class="task-text">${escapeHtml(task.text)}</div>
      <button class="task-delete" data-action="delete">×</button>
    `;
    li.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action === 'toggle') {
        task.done = !task.done;
      } else if (action === 'delete') {
        state.tasks = state.tasks.filter(t => t.id !== task.id);
        if (state.activeTaskId === task.id) state.activeTaskId = null;
      } else {
        state.activeTaskId = state.activeTaskId === task.id ? null : task.id;
      }
      renderTasks();
      updateCurrentTask();
    });
    el.taskList.appendChild(li);
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function addTask() {
  const text = el.taskInput.value.trim();
  if (!text) return;
  state.tasks.push({ id: Date.now(), text, done: false });
  el.taskInput.value = '';
  renderTasks();
}

// =========== DESAFIO MATEMÁTICO (LATEX/KaTeX) ===========
// Cada questão usa LaTeX. KaTeX renderiza isso como notação matemática real.
const QUESTIONS = [
  // DERIVADAS — polinômios e regras básicas
  { q: "\\frac{d}{dx}\\left[ x^3 + 2x \\right]", correct: "3x^2 + 2", wrong: ["3x^2 + 2x", "x^2 + 2", "3x^3 + 2"] },
  { q: "\\frac{d}{dx}\\left[ 3x^2 + 5x - 7 \\right]", correct: "6x + 5", wrong: ["6x + 5x", "3x + 5", "6x^2 + 5"] },

  // DERIVADAS — regra da cadeia
  { q: "\\frac{d}{dx}\\left[ \\sin(2x) \\right]", correct: "2\\cos(2x)", wrong: ["\\cos(2x)", "-2\\cos(2x)", "2\\sin(2x)"] },
  { q: "\\frac{d}{dx}\\left[ \\cos(x^2) \\right]", correct: "-2x\\sin(x^2)", wrong: ["2x\\sin(x^2)", "-\\sin(x^2)", "-2x\\cos(x^2)"] },
  { q: "\\frac{d}{dx}\\left[ e^{3x} \\right]", correct: "3e^{3x}", wrong: ["e^{3x}", "3xe^{3x}", "\\frac{e^{3x}}{3}"] },
  { q: "\\frac{d}{dx}\\left[ \\ln(x^2+1) \\right]", correct: "\\frac{2x}{x^2+1}", wrong: ["\\frac{1}{x^2+1}", "2x", "\\frac{2}{x^2+1}"] },
  { q: "\\frac{d}{dx}\\left[ (x+1)^5 \\right]", correct: "5(x+1)^4", wrong: ["(x+1)^4", "5(x+1)^5", "5x^4"] },

  // DERIVADAS — quociente
  { q: "\\frac{d}{dx}\\left[ \\dfrac{x}{x+1} \\right]", correct: "\\dfrac{1}{(x+1)^2}", wrong: ["\\dfrac{1}{x+1}", "-\\dfrac{1}{(x+1)^2}", "\\dfrac{x}{(x+1)^2}"] },
  { q: "\\frac{d}{dx}\\left[ \\dfrac{2x+1}{x} \\right]", correct: "-\\dfrac{1}{x^2}", wrong: ["\\dfrac{1}{x^2}", "\\dfrac{2}{x}", "\\dfrac{2x-1}{x^2}"] },
  { q: "\\frac{d}{dx}\\left[ \\dfrac{\\sin(x)}{x} \\right]", correct: "\\dfrac{x\\cos(x) - \\sin(x)}{x^2}", wrong: ["\\dfrac{\\cos(x)}{x}", "\\dfrac{\\cos(x) - \\sin(x)}{x^2}", "\\dfrac{\\sin(x) - x\\cos(x)}{x^2}"] },

  // DERIVADAS — produto
  { q: "\\frac{d}{dx}\\left[ x^2 \\sin(x) \\right]", correct: "2x\\sin(x) + x^2\\cos(x)", wrong: ["2x\\cos(x)", "x^2\\cos(x)", "2x\\sin(x) - x^2\\cos(x)"] },
  { q: "\\frac{d}{dx}\\left[ x \\cdot e^x \\right]", correct: "e^x(1 + x)", wrong: ["e^x", "x e^x", "e^x(x - 1)"] },

  // INTEGRAIS — básicas
  { q: "\\int 2x \\, dx", correct: "x^2 + C", wrong: ["2x^2 + C", "\\frac{x^2}{2} + C", "2 + C"] },
  { q: "\\int \\cos(x) \\, dx", correct: "\\sin(x) + C", wrong: ["-\\sin(x) + C", "\\cos(x) + C", "-\\cos(x) + C"] },
  { q: "\\int e^x \\, dx", correct: "e^x + C", wrong: ["xe^x + C", "\\dfrac{e^x}{x} + C", "\\ln(x) + C"] },
  { q: "\\int \\frac{1}{x} \\, dx", correct: "\\ln|x| + C", wrong: ["\\dfrac{1}{x^2} + C", "-\\dfrac{1}{x^2} + C", "x + C"] },
  { q: "\\int x^2 \\, dx", correct: "\\dfrac{x^3}{3} + C", wrong: ["2x + C", "x^3 + C", "3x^3 + C"] },
  { q: "\\int (3x^2 + 4x) \\, dx", correct: "x^3 + 2x^2 + C", wrong: ["6x + 4 + C", "x^3 + 4x^2 + C", "3x^3 + 2x^2 + C"] },

  // INTEGRAIS — substituição
  { q: "\\int \\sin(2x) \\, dx", correct: "-\\dfrac{\\cos(2x)}{2} + C", wrong: ["\\dfrac{\\cos(2x)}{2} + C", "-2\\cos(2x) + C", "-\\cos(2x) + C"] },
  { q: "\\int e^{2x} \\, dx", correct: "\\dfrac{e^{2x}}{2} + C", wrong: ["2e^{2x} + C", "e^{2x} + C", "e^x + C"] },
  { q: "\\int 2x \\cos(x^2) \\, dx", correct: "\\sin(x^2) + C", wrong: ["\\cos(x^2) + C", "-\\sin(x^2) + C", "2\\sin(x^2) + C"] },
  { q: "\\int (2x+1)(x^2+x)^4 \\, dx", correct: "\\dfrac{(x^2+x)^5}{5} + C", wrong: ["(x^2+x)^5 + C", "5(x^2+x)^5 + C", "\\dfrac{(x^2+x)^4}{4} + C"] },

  // INTEGRAÇÃO POR PARTES
  { q: "\\int x \\cdot e^x \\, dx", correct: "e^x(x - 1) + C", wrong: ["x e^x + C", "e^x(x + 1) + C", "\\dfrac{x^2 e^x}{2} + C"] },
  { q: "\\int x \\cos(x) \\, dx", correct: "x\\sin(x) + \\cos(x) + C", wrong: ["x\\sin(x) - \\cos(x) + C", "\\sin(x) + C", "-x\\sin(x) + \\cos(x) + C"] },
  { q: "\\int \\ln(x) \\, dx", correct: "x\\ln(x) - x + C", wrong: ["\\dfrac{1}{x} + C", "\\ln(x) + C", "x\\ln(x) + x + C"] },
];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Renderiza LaTeX com KaTeX. Se KaTeX ainda não carregou, mostra o texto cru
// como fallback e tenta renderizar de novo em 100ms.
function renderMath(element, latex, displayMode) {
  if (typeof katex !== 'undefined') {
    try {
      katex.render(latex, element, {
        throwOnError: false,
        displayMode: displayMode,
      });
    } catch (e) {
      element.textContent = latex;
    }
  } else {
    element.textContent = latex;
    setTimeout(() => renderMath(element, latex, displayMode), 100);
  }
}

function showMathChallenge() {
  loadNewQuestion();
  el.modal.classList.add('show');
  el.feedback.textContent = '';
  el.feedback.className = 'modal-feedback';
}

function loadNewQuestion() {
  const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
  state.currentQuestion = q;
  renderMath(el.question, q.q, true);

  const allOptions = shuffleArray([q.correct, ...q.wrong]);
  el.options.innerHTML = '';
  allOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.value = opt;
    renderMath(btn, opt, false);
    btn.onclick = () => checkAnswer(opt, btn);
    el.options.appendChild(btn);
  });
}

function checkAnswer(answer, btn) {
  if (answer === state.currentQuestion.correct) {
    el.modal.classList.remove('show');
    forceStop();
  } else {
    btn.classList.add('wrong');
    el.feedback.textContent = 'Errado. Vem outra.';
    el.feedback.className = 'modal-feedback error';
    setTimeout(() => {
      loadNewQuestion();
      el.feedback.textContent = '';
      el.feedback.className = 'modal-feedback';
    }, 900);
  }
}

function closeModal() {
  el.modal.classList.remove('show');
}

// =========== EVENTOS ===========
el.startBtn.addEventListener('click', startTimer);
el.pauseBtn.addEventListener('click', pauseTimer);
el.stopBtn.addEventListener('click', stopTimer);
el.addTaskBtn.addEventListener('click', addTask);
el.taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});
el.modalCancel.addEventListener('click', closeModal);
el.modal.addEventListener('click', (e) => {
  if (e.target === el.modal) closeModal();
});

el.focusMin.addEventListener('change', () => {
  if (!state.isRunning && !state.isPaused) {
    state.remainingSec = (parseInt(el.focusMin.value) || 25) * 60;
    updateDisplay();
  }
});

el.soundTestBtn.addEventListener('click', testSound);
el.soundUploadBtn.addEventListener('click', () => el.soundFileInput.click());
el.soundFileInput.addEventListener('change', handleSoundUpload);
el.soundRemoveBtn.addEventListener('click', removeCustomSound);
el.silenceBtn.addEventListener('click', stopAllAudio);

updateDisplay();
updateStatus();
renderTasks();
</script>
